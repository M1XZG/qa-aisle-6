name: Create non-member rejection test PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open bot-authored test pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `test/nonmember-bot-${context.runId}`;

            const main = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: main.data.object.sha,
            });

            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path: "news.json",
              ref: "main",
            });
            const content =
              Buffer.from(current.data.content, "base64").toString("utf8") + "\n";

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "news.json",
              branch,
              message: "Test non-member PR rejection",
              content: Buffer.from(content).toString("base64"),
              sha: current.data.sha,
            });

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              base: "main",
              head: branch,
              title: "Prove non-member PR rejection",
              body: "Temporary QA proof generated by github-actions[bot].",
            });
            core.info(`Opened ${pullRequest.data.html_url}`);
